# =====================================================================
#  Build & Push – PHP-FPM Hardened (WordPress-optimized)
#  Multi-stage Dockerfile → ghcr.io + Docker Hub
#  Lint + Build + Sign (cosign OIDC) + Scan (Trivy) + Release
# =====================================================================
name: build-push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Dockerfile'
      - 'conf/**'
      - 'scripts/entrypoint.sh'
      # test.sh conditionne la promotion des digests : une image correcte peut
      # etre recalee par une assertion perimee (arrive le 2026-08-28 avec intl).
      # Sans ce chemin, corriger le test ne revalidait rien.
      - 'scripts/test.sh'
      - 'scripts/**'
      - 'init.go'
      - 'init_test.go'
      - 'go.mod'
      - 'image.manifest'
      - '.github/workflows/build-push.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: php-fpm-hardened

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
  attestations: write

jobs:
  # -------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # versions.json, seule source des versions du build : controle du depot
      # (php n'a pas de copie du script, l'action l'apporte, epinglee).
      - name: versions.json, seule source
        uses: jbsky/hardened-ci/versions@28bf7b0bb40bd7f8e2eaae64534b053e1976bae0 # v0.7.0

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

      # Six depots publics et autonomes portent les MEMES scripts, dupliques
      # parce qu'ils ne peuvent pas se referencer. Rien ne les tenait alignes
      # que la discipline. Toucher un script partage oblige desormais a
      # toucher sa reference, donc a le voir dans le diff de la PR. La
      # divergence ENTRE depots se voit avec
      # opencode-profile/scripts/check-vendored-sync.sh, qui a les six clones.
      - name: Vendored scripts unchanged
        run: sha256sum -c scripts/VENDORED.sha256

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          set -euo pipefail
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # -------------------------------------------------------------------
  #  Builds amd64 once. On a real push/tag (never on pull_request -- fork
  #  PRs must not get registry credentials) it's pushed BY DIGEST, so
  #  `test` below can pull back that exact digest and run the functional
  #  tests against those literal bytes -- not a separately-built image
  #  that "should" match thanks to cache. `promote` merges that same
  #  digest with build-arm64's into the final multi-arch manifest; amd64
  #  never gets rebuilt between "tested" and "shipped" (arm64 can't be
  #  functionally tested here at all -- would need slow, less reliable
  #  QEMU-emulated containers -- so it's still just built, not tested). On
  #  a PR there's no registry to push to, so the image is instead
  #  exported to a local tarball and handed to `test` (a separate
  #  job/runner) as an artifact.
  # -------------------------------------------------------------------
  build:
    name: Build image
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      # Build-args generes depuis versions.json (le controle tourne avec) :
      # chaque docker/build-push-action du job doit les recevoir.
      - name: Build-args depuis versions.json
        id: build-args
        uses: jbsky/hardened-ci/versions@28bf7b0bb40bd7f8e2eaae64534b053e1976bae0 # v0.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker-compose.yml's php-fpm service reads its `image:` tag from
      # `${REGISTRY:-gitlab.home.arpa:5050}/docker/php:${TAG:-latest}` --
      # this workflow ALSO sets a shell env var named REGISTRY (env.REGISTRY
      # = ghcr.io, used throughout for GHCR references), which collides:
      # compose picks it up too and resolves to ghcr.io/docker/php:latest,
      # not this repo's actual image name. Ask compose itself what it
      # expects rather than hardcoding a guess. Deterministic/local (just
      # reads docker-compose.yml + env), so `test` below recomputes the
      # same value independently rather than needing it passed as an
      # output.
      - name: Resolve compose's expected local tag
        id: compose-image
        run: echo "tag=$(docker compose config --images php-fpm)" >> "$GITHUB_OUTPUT"

      - name: Make room for local tarball export (PR only)
        if: env.PUBLISH != 'true'
        run: mkdir -p /tmp/image-tar

      - name: Build (push-by-digest, or local tarball on PR)
        id: build
        uses: docker/build-push-action@v7
        with:
          build-args: ${{ steps.build-args.outputs.build-args }}
          context: .
          platforms: linux/amd64
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.NAMESPACE, env.IMAGE_NAME) || 'type=docker,dest=/tmp/image-tar/image.tar' }}
          tags: ${{ env.PUBLISH != 'true' && steps.compose-image.outputs.tag || '' }}
          sbom: ${{ env.PUBLISH }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=php-fpm-linux/amd64
          cache-to: type=gha,mode=max,scope=php-fpm-linux/amd64
          # Le stage `prep` porte les paquets Alpine qui finissent dans
          # l'image. Le servir depuis le cache GHA rend deux controles
          # menteurs a la fois : le manifeste compare l'image a une reference
          # generee sur un build frais, et le scan CVE du meme stage examine
          # des paquets perimes. Un controle dont le resultat depend de l'age
          # d'un cache invisible ne controle rien. Le cout est un `apk add`.
          no-cache-filters: prep

      # Le stage `prep` est la seule Alpine qui reste lisible par un scanner :
      # il contient exactement les paquets runtime qui seront copies dans
      # l'image finale `FROM scratch`, ou plus aucun scanner ne saura dire de
      # quel paquet vient un fichier. Viser `builder` scannerait la chaine de
      # compilation, qui n'entre dans aucune image.
      #
      # Deux comportements dans la meme etape, volontairement dissocies :
      # le SARIF remonte CRITICAL+HIGH pour que tout soit visible dans
      # l'onglet Security ; l'echec est reserve aux CRITICAL *corrigeables*
      # en amont (`ignore-unfixed`), pour qu'un job rouge veuille toujours
      # dire « un upgrade du stage prep corrige une faille critique » --
      # jamais « Alpine a publie un avis et on ne peut rien y faire ».
      - name: Build prep stage (Alpine with runtime deps)
        uses: docker/build-push-action@v7
        with:
          build-args: ${{ steps.build-args.outputs.build-args }}
          context: .
          target: prep
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}-prep:scan
          no-cache-filters: prep
          cache-from: type=gha,scope=php-fpm-linux/amd64

      - name: Trivy scan prep stage (report CRITICAL+HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-prep:scan
          format: sarif
          output: trivy-prep.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload prep SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-prep.sarif
          category: ${{ env.IMAGE_NAME }}-deps

      # SBOM des paquets du stage prep, attestee sur l'image publiee (job
      # promote). L'image finale FROM scratch n'a plus de base apk : c'est le
      # seul moyen de re-auditer plus tard ce qui a ete publie (cve-watch.yml).
      # prep est reconstruit ici a part du build final : la SBOM decrit la
      # meme resolution apk a quelques minutes pres, pas au bit pres.
      - name: SBOM of prep stage (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-prep:scan
          format: cyclonedx
          output: sbom-prep.cdx.json

      - name: Upload prep SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-prep
          path: sbom-prep.cdx.json
          if-no-files-found: error

      - name: Trivy gate prep stage (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-prep:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload image tarball (PR only, for the test job)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-tar
          path: /tmp/image-tar/image.tar
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------
  #  Loads the exact bytes `build` just produced (pulled by digest from
  #  the registry, or loaded from its tarball artifact on a PR) and runs
  #  the functional tests against them.
  # -------------------------------------------------------------------
  test:
    name: Functional tests
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Login ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve compose's expected local tag
        id: compose-image
        run: echo "tag=$(docker compose config --images php-fpm)" >> "$GITHUB_OUTPUT"

      - name: Pull built digest for testing
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          docker pull "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
          docker tag  "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}" "${{ steps.compose-image.outputs.tag }}"

      - name: Download image tarball (PR only)
        if: env.PUBLISH != 'true'
        uses: actions/download-artifact@v8
        with:
          name: image-tar
          path: /tmp/image-tar

      - name: Load image tarball (PR only)
        if: env.PUBLISH != 'true'
        run: docker load -i /tmp/image-tar/image.tar

      - name: Build & start stack
        run: docker compose up -d --no-build php-fpm

      - name: Wait for healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' php-fpm-hardened 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "::error::php-fpm-hardened did not become healthy in time"
          docker compose logs
          exit 1

      # The registry tag (and the release notes) come from the Dockerfile's
      # FROM tag, while the bytes come from the digest pinned next to it. On
      # 2026-07-31 those two disagreed for 18 days: version-watch rewrote the
      # tag to 8.5.9, left the 8.5.8 digest in place, and every build shipped
      # 8.5.8 under an 8.5.9 tag. Assert on the running image instead.
      - name: Assert the image is the PHP version we tag it with
        run: |
          set -euo pipefail
          want=$(grep -oP '^FROM php:\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1)
          # php-fpm, pas le CLI : celui-ci n'est plus embarque (28,8 Mo inutiles).
          # `php-fpm -v` -> "PHP 8.5.9 (fpm-fcgi) (built: ...)"
          got=$(docker exec php-fpm-hardened php-fpm -v 2>/dev/null | head -1 | awk '{print $2}')
          echo "Dockerfile tag: ${want} | image: ${got}"
          if [ "$want" != "$got" ]; then
            echo "::error::image ships PHP ${got} but would be published as ${want} (FROM tag and @sha256 pin disagree)"
            exit 1
          fi

      # Le manifeste dit ce qui est DANS l'image : chemins, modes, uid/gid,
      # capabilities de fichier, et doublons de contenu. Rien d'autre dans
      # cette chaine ne regarde ca -- hadolint lit le Dockerfile (il verifie
      # qu'une ligne existe, pas qu'elle a marche), et Trivy ne parle que de
      # paquets, dont une image FROM scratch n'a plus aucun. Toute derive
      # echoue ici ; si elle est voulue, regenerer le manifeste DANS LE MEME
      # COMMIT -- c'est le diff qu'on relit dans la PR.
      - name: Image manifest
        run: ./scripts/image-manifest.py --check ${{ steps.compose-image.outputs.tag }} -m image.manifest

      # `lddtree` signale une dependance introuvable sur stderr et sort quand
      # meme en 0 : un build peut donc publier une image `FROM scratch` a
      # laquelle il manque une bibliotheque, l'erreur ne sortant qu'au
      # demarrage du conteneur, en production. Constate le 2026-08-28 sur
      # clamav-hardened (libbz2.so.1) et suricata (dix modules Python). Ici on
      # demande au vrai chargeur musl, dans un chroot sur le filesystem de
      # l'image, de resoudre chaque ELF embarque.
      - name: Image closure
        run: ./scripts/check-image-closure.sh ${{ steps.compose-image.outputs.tag }}

      - name: Run smoke tests
        run: ./scripts/test.sh php-fpm-hardened

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------------
  #  arm64 companion build -- sur un runner arm64 NATIF (ubuntu-24.04-arm,
  #  gratuit pour un depot public), pushed by digest for promote to merge.
  #  Sous QEMU, un rebuild complet prenait ~27 min contre ~3 en amd64 et
  #  retardait d'autant chaque publication ; en natif plus d'emulation.
  #  Independent of build/test (different platform, no shared artifact),
  #  so it runs in parallel with them rather than waiting on the amd64
  #  test to pass -- `promote` below still needs both `test` and this job
  #  to succeed, so a failed amd64 test still blocks shipping either way.
  # -------------------------------------------------------------------
  build-arm64:
    name: Build arm64
    needs: lint
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # Build-args generes depuis versions.json (le controle tourne avec) :
      # chaque docker/build-push-action du job doit les recevoir.
      - name: Build-args depuis versions.json
        id: build-args
        uses: jbsky/hardened-ci/versions@28bf7b0bb40bd7f8e2eaae64534b053e1976bae0 # v0.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          build-args: ${{ steps.build-args.outputs.build-args }}
          context: .
          platforms: linux/arm64
          sbom: true
          provenance: mode=max
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=php-fpm-linux/arm64-natif
          cache-to: type=gha,mode=max,scope=php-fpm-linux/arm64-natif
          # Meme raison que sur amd64, et une de plus : deux arches servies
          # depuis des caches d'ages differents publieraient des versions de
          # bibliotheques differentes sous un seul tag.
          no-cache-filters: prep

  # -------------------------------------------------------------------
  #  Un tag <version>.<revision> est immuable : le routeur et les manifestes
  #  l'epinglent. Le compteur ne compte que les commits sur les inputs de
  #  l'image ; un build declenche par autre chose (test, workflow, relance
  #  manuelle) retombe sur une revision deja publiee et la reecrirait --
  #  arrive 3 fois a nginx-waf-hardened:1.30.5.16. Tag deja present : pas
  #  de promotion, run vert, latest ne bouge pas. Toute autre reponse du
  #  registre que 200/404 fait echouer : ne jamais reecrire par defaut.
  # -------------------------------------------------------------------
  revision:
    name: Immutable tag guard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.revision.outputs.tag }}
      published: ${{ steps.published.outputs.published }}
    steps:
      # fetch-depth 0: build-revision.sh counts commits, a shallow clone
      # would silently make every build .0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build revision
        id: revision
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '^FROM php:\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1)
          REVISION=$(./scripts/build-revision.sh --source Dockerfile --grep '^FROM php:\K[0-9.]+' -- Dockerfile conf/ scripts/entrypoint.sh init.go go.mod)
          echo "tag=${VERSION}.${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Is this tag already published?
        id: published
        env:
          REPO: ${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.revision.outputs.tag }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS "https://${REGISTRY}/token?scope=repository:${REPO}:pull" | jq -r .token)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://${REGISTRY}/v2/${REPO}/manifests/${TAG}")
          case "$CODE" in
            200) PUBLISHED=true
                 echo "- \`${TAG}\` est deja publie : pas de promotion (aucun input de l'image n'a change)" >> "$GITHUB_STEP_SUMMARY" ;;
            404) PUBLISHED=false
                 echo "- \`${TAG}\` : nouvelle revision, promotion" >> "$GITHUB_STEP_SUMMARY" ;;
            *)   echo "::error::${REGISTRY} a repondu ${CODE} pour ${REPO}:${TAG}"; exit 1 ;;
          esac
          echo "published=${PUBLISHED}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  #  Merges build's tested amd64 digest with build-arm64's digest into the
  #  final multi-arch manifest -- no rebuild of either.
  # -------------------------------------------------------------------
  promote:
    name: Promote tested digests
    needs: [build, test, build-arm64, revision]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && needs.revision.outputs.published == 'false'
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}

    steps:
      # La revision vient du job revision : plus besoin de l'historique ici.
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve PHP version
        id: versions
        run: |
          set -euo pipefail
          # Read the version actually being built from the Dockerfile's own
          # FROM line (matches version-watch.yml's own parsing). The prior
          # `docker run --rm php:8.4-fpm-alpine php -r 'echo PHP_VERSION;'`
          # hardcoded the 8.4 branch as a leftover from before the repo
          # moved to 8.5 -- it kept resolving 8.4's current patch (8.4.22)
          # and mistagging :latest with it, even though the image being
          # built and pushed was genuinely PHP 8.5.7.
          PHP_VER=$(grep -oP '^FROM php:\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1)
          echo "php=${PHP_VER}" >> "$GITHUB_OUTPUT"
          echo "### Resolved versions" >> "$GITHUB_STEP_SUMMARY"
          echo "- PHP: ${PHP_VER}" >> "$GITHUB_STEP_SUMMARY"

      - name: Compute Docker Hub image name
        id: dockerhub-image
        if: steps.dockerhub.outputs.available == 'true'
        env:
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "image=docker.io/${DOCKERHUB_NS}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Compute build revision
        id: revision
        run: |
          set -euo pipefail
          TAG="${{ needs.revision.outputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "- Build revision: ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub-image.outputs.image }}
          tags: |
            type=raw,value=${{ steps.revision.outputs.tag }}
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.versions.outputs.php }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest from tested digests (no rebuild)
        id: manifest
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}"
          TAGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAGS="${TAGS} -t ${tag}"
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create ${TAGS} \
            "${IMAGE}@${{ needs.build.outputs.digest }}" \
            "${IMAGE}@${{ needs.build-arm64.outputs.digest }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.versions.outputs.php }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (OIDC keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.available }}
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            COSIGN_REPOSITORY="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}" \
              cosign sign --yes "docker.io/${DOCKERHUB_NS}/${{ env.IMAGE_NAME }}@${DIGEST}"
          fi

      - name: Download prep SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-prep

      - name: Attest prep SBOM (CycloneDX)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx --predicate sbom-prep.cdx.json \
            "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${DIGEST}"
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          format: sarif
          output: trivy-php.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-php.sarif
          category: php-fpm

      - name: GitHub SLSA Attestation
        if: "!startsWith(github.ref, 'refs/heads/dependabot/')"
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.available }}
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "### php-fpm-hardened" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.manifest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            echo "docker pull docker.io/${DOCKERHUB_NS}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------------
  # -------------------------------------------------------------------
  #  Le README nomme le tag immuable courant. On le regenere ici pour que la
  #  doc ne puisse jamais designer un tag que les registres ne portent plus.
  # -------------------------------------------------------------------
  update-readme:
    name: Refresh README tag block
    needs: promote
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth 0: build-revision.sh counts commits, a shallow clone
      # would silently make every image .0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rewrite tag block
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '^FROM php:\K[0-9.]+' Dockerfile | head -1)
          REVISION=$(./scripts/build-revision.sh --source Dockerfile --grep '^FROM php:\K[0-9.]+' -- Dockerfile conf/ scripts/entrypoint.sh init.go go.mod)
          ./scripts/update-readme-tags.sh "jbsky/php-fpm-hardened=${VERSION}=${VERSION}.${REVISION}"

      - name: Commit if changed
        run: |
          set -euo pipefail
          # `git diff --quiet && exit 0` would abort the step under `set -e`
          # on the branch where there IS a change: use an explicit if.
          if git diff --quiet README.md; then
            echo "README already names the current tag"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): tag immuable courant [skip ci]"
          # A concurrent publish may have landed first: rebase and retry
          # rather than fail the run over a race.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main || true
          done
          exit 1

  cleanup:
    name: Prune old registry tags
    needs: promote
    # Un workflow appele ne peut que reduire les permissions : les donner ici.
    permissions:
      contents: read
      packages: write
    uses: jbsky/hardened-ci/.github/workflows/registry-cleanup.yml@0910a8f8fcbacbbe655870a91bd0716d949a9c82 # v0.3.0
    with:
      images: '["php-fpm-hardened"]'
    # Explicites : `secrets: inherit` n'est pas garanti entre depots d'un
    # compte personnel.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # -------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [revision, promote]
    # Un tag git pose sur un commit deja publie ne repromeut rien (garde
    # revision) : la release se fait quand meme.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v')
      && needs.revision.result == 'success'
      && (needs.promote.result == 'success' || needs.revision.outputs.published == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tarball + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          tar --exclude='.git' --exclude='dist' \
              -czf "dist/php-fpm-hardened-${VERSION}.tar.gz" \
              --transform "s,^,php-fpm-hardened-${VERSION}/," \
              $(ls -A | grep -v -E '^(\.git|dist)$')
          cd dist
          sha256sum "php-fpm-hardened-${VERSION}.tar.gz" > "php-fpm-hardened-${VERSION}.sha256"
          sha512sum "php-fpm-hardened-${VERSION}.tar.gz" > "php-fpm-hardened-${VERSION}.sha512"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/php-fpm-hardened-${{ github.ref_name }}.tar.gz
            dist/php-fpm-hardened-${{ github.ref_name }}.sha256
            dist/php-fpm-hardened-${{ github.ref_name }}.sha512

  # -------------------------------------------------------------------
  #  Un build rouge hors PR ne prevenait personne : version-watch reste vert
  #  (il ne fait que dispatcher), et du 2026-09-10 au 09-30 tous les rebuilds
  #  ont echoue en silence -- des correctifs de securite jamais publies.
  #  Une seule issue par branche : ouverte au premier echec, commentee tant
  #  que ca dure, fermee par le premier run vert. Pas sur pull_request : les
  #  PR Dependabot n'ont qu'un jeton en lecture, et la PR montre deja le rouge.
  # -------------------------------------------------------------------
  notify:
    name: Issue si echec
    needs: [lint, build, test, build-arm64, revision, promote, update-readme, cleanup, release]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const rouges = Object.entries(needs)
              .filter(([, j]) => j.result === 'failure' || j.result === 'cancelled')
              .map(([nom]) => nom);
            const branche = context.ref.replace(/^refs\/(heads|tags)\//, '');
            const titre = `[CI] build-push en echec sur ${branche}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: ouvertes } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-failure', per_page: 100 });
            const issue = ouvertes.find(i => i.title === titre);
            if (rouges.length) {
              const corps = `Run \`${context.eventName}\` sur ${context.sha.slice(0, 7)} en echec `
                + `(${rouges.join(', ')}) : ${run}`;
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: corps });
              } else {
                await github.rest.issues.create({ ...context.repo, title: titre, body: corps,
                  labels: ['ci-failure', 'automated'] });
              }
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                body: `Repasse au vert : ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
