# Faux positif Grype confirme, pas une vulnerabilite reelle. Grype (via
# syft) catalogue le fichier de l'extension PHP `curl.so`
# (/usr/local/lib/php/extensions/*/curl.so) comme le paquet `curl`, en
# prenant la version de PHP ("8.5.9") pour celle de la bibliotheque curl --
# ce qui fait matcher une vingtaine de CVE curl historiques (jusqu'a
# Critical) sur une version de curl qui n'a jamais existe. La vraie libcurl
# du runtime est 8.21.0 : verifie dans l'image publiee avec
# `php -r 'echo curl_version()["version"];'` (et non par la soname
# libcurl.so.4.8.0, ou ".8.0" est un suffixe ABI, pas une version).
#
# La regle porte sur l'EMPLACEMENT du faux positif, pas sur une version :
# elle etait pinnee `version: 8.5.8`, et le premier bump reel de PHP
# (8.5.8 -> 8.5.9, 2026-08-18) a fait ressortir toute la grappe et rougir
# l'audit. Scoper par chemin la rend stable a travers les bumps tout en
# laissant remonter un vrai paquet curl s'il etait un jour ajoute a
# l'image (aucun binaire curl n'y est present aujourd'hui).
ignore:
  - package:
      name: curl
      location: "/usr/local/lib/php/extensions/*/curl.so"
